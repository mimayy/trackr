# Maven Wrapper, script-only distribution.
#
# `./mvnw` downloads this Maven into ~/.m2/wrapper the first time it runs, so
# the repository carries no binaries. If you already have Maven installed, plain
# `mvn` works just as well.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
